<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Dashboard theo dõi kết quả học tập">
    <title>Dashboard | StudyFlow</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="page">
    <header class="topbar"><a class="brand" href="home.html"><span class="brand-mark">✓</span> StudyFlow</a>
        <nav class="nav"><a href="home.html">Trang chủ</a><a class="active" href="dashboard.html">Dashboard</a></nav>
        <div class="user-pill"><span class="avatar">S</span><span data-user>Bạn</span></div>
    </header>
    <main class="main" id="dashboard">
        <div class="hero-row">
            <div><span class="eyebrow">Báo cáo cá nhân</span>
                <h1>Kết quả học tập</h1>
                <p>Tổng hợp từ những bài học bạn đã hoàn thành.</p>
            </div>
        </div>
        <section class="stats">
            <div class="stat"><small>Tiến độ trung bình</small><strong id="overall">0%</strong></div>
            <div class="stat"><small>Số bài đã học</small><strong id="lessonCount">0</strong></div>
            <div class="stat"><small>Môn hoàn thành</small><strong><span id="doneCount">0</span>/3</strong></div>
        </section>
        <section class="dashboard-grid" style="margin-top:22px">
            <div class="card">
                <h2>Tiến độ theo môn</h2>
                <div class="bars-chart">
                    <div class="chart-col">
                        <div class="chart-bar" data-chart="toan"></div><span>Toán</span>
                    </div>
                    <div class="chart-col">
                        <div class="chart-bar" data-chart="ly"></div><span>Vật lý</span>
                    </div>
                    <div class="chart-col">
                        <div class="chart-bar" data-chart="hoa"></div><span>Hóa học</span>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Tổng quan</h2>
                <div class="ring"><strong id="ringOverall">0%</strong></div>
                <div class="legend">
                    <div class="legend-row"><span>Toán học</span><span data-score="toan">0%</span></div>
                    <div class="legend-row"><span>Vật lý</span><span data-score="ly">0%</span></div>
                    <div class="legend-row"><span>Hóa học</span><span data-score="hoa">0%</span></div>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>

</html>
